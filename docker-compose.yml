
services:
  backend:
    build:
      context: ./backend
    container_name: inventory-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: inventory-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
